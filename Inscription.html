<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
  margin: 0;
  padding: 0;
  background: linear-gradient(to top, #040864,#1f1786,  #3c26a9, #4e52b9 , #504781);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: sans-serif;
}
@keyframes changeBackground 
{
   
     25% {
        background-color:rgb(190, 31, 187) ;
    }
     25% {
        background-color:rgb(52, 167, 126) ;
    }
     25% {
        background-color:rgb(190, 24, 151) ;
    }
     25% {
        background-color:rgb(200, 232, 73) ;
    } 25% {
        background-color:rgb(228, 176, 66) ;
    }

}

.login-box {
  position: relative;
  width: 300px;
  padding: 40px;
  background:transparent;
  box-shadow: 0 15px 25px rgba(8, 0, 113, 0.6);
  border-radius: 10px;
  color: rgb(255, 255, 255);
}

.login-box h2 {
  margin: 0 0 30px;
  padding: 0;
  text-align: center;
}

.user-box {
  position: relative;
}
.user-box input {
  width: 100%;
  padding: 10px 0;
  font-size: 16px;
  color: #fff;
  margin-bottom: 30px;
  border: none;
  border-bottom: 1px solid #fff;
  background: transparent;
  outline: none;
}

.user-box label {
  position: absolute;
  top: 0;
  left: 0;
  padding: 10px 0;
  font-size: 16px;
  color: #fff;
  pointer-events: none;
  transition: 0.5s;
}

.user-box input:focus ~ label,
.user-box input:valid ~ label {
  top: -20px;
  left: 0;
  color: #d9ff00;
  font-size: 12px;
}

a {
  position: relative;
  display: inline-block;
  padding: 10px 20px;
  color: #03e9f4;
  font-size: 16px;
  text-decoration: none;
  text-transform: uppercase;
  overflow: hidden;
  transition: 0.5s;
  margin-top: 40px;
  letter-spacing: 4px;
}

a:hover {
  background: #03e9f4;
  color: #fff;
  border-radius: 5px;
  box-shadow: 0 0 5px #03e9f4,
              0 0 25px #03e9f4,
              0 0 50px #03e9f4,
              0 0 100px #03e9f4;
}

a span {
  position: absolute;
  display: block;
}
    </style>
</head>
<body>
 <div class="login-box">
  <header>Veuillez vous inscrire ,si vous n'avez pas encore un compte chez nous !</header></br></br>
    <h2>Login</h2>
    <form>
      <div class="user-box">
        <input type="text" name="" required="">
        <label>Username</label>
      </div>
      <div class="user-box">
        <input type="password" name="" required="">
        <label>Password</label>
      </div>
      <a href="choix.html">
        Login
        <span></span>
      </a>
    </form>
    <p><b><a href="Cliquez Ici.html" class="lien">Retour</a></b></p>
</body>
</html>
