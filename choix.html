<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Page</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      height: 100vh;
      background: linear-gradient(135deg, #3a0ca3, #7209b7, #4361ee, #4cc9f0);
      display: flex;
      justify-content: center;
      align-items: center;
      background-size: 400% 400%;
      animation: gradientMove 10s ease infinite;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .login-container {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      padding: 40px 30px;
      width: 300px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
      text-align: center;
      color: #fff;
    }

    .login-container img {
      width: 80px;
      border-radius: 50%;
      margin-bottom: 20px;
      opacity: 0.8;
    }

    .input-group {
      position: relative;
      margin-bottom: 20px;
      text-align: left;
    }

    .input-group input {
      width: 85%;
      padding: 10px 10px 10px 40px;
      border: none;
      border-radius: 5px;
      outline: none;
      background: rgba(255,255,255,0.9);
      font-size: 14px;
    }

    .input-group i {
      position: absolute;
      top: 50%;
      left: 10px;
      transform: translateY(-50%);
      color: #333;
    }
    .login-button {
      background-color: #1e1e4e;
      color: #fff;
      border: none;
      padding: 10px;
      width: 100%;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .login-button:hover {
      background-color: #2c2c6c;
    }
.ben2{
    float: left;
}
input{
  border-radius: 10px;
  height: 200px;
  width: 100px;
}
option{
  font-weight: bolder;
}
  </style>
</head>
<body>

  <div class="login-container">
    <form>
      <div class="input-group">
 <i class="fa-solid fa-user"></i>
   <label for="Faites un choix" class="input">Choix :</label>
        <select name="" id="">
          <option value=""></option>
          <option value="">MARIAGES</option>
          <option value="">ANNIVERSAIRES</option>
          <option value="">MONTAGES</option>
          <option value="">SEJOURS</option>
        </select>
      </div>
      <button class="login-button" type="submit"><a href="paiement.html"></a>Reservez</button>
    </form></br>

  <!-- Font Awesome for icons -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  
</body>
</html>
