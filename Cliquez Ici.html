<style>
  h1{
    text-align: center;
  }
        body{
    animation: changeBackground 7s infinite;
    }
    .button-container {
  display: flex;
  justify-content: space-between;

  
}

img{
  width: 100%;
}
.button {
  color: white;
  padding: 15px 30px;
  border: none;
  border-radius: 50px;
  font-size: 1.2em;
  cursor: pointer;
}

    .glossy-button::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      background: linear-gradient(135deg, rgba(255,255,255,0.6), rgba(255,255,255,0));
      opacity: 0.5;
      pointer-events: none;
    }
    .glossy-button {
      padding: 15px 25px;
      border-radius: 50px;
      color: white;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
    }    .button-grid {
      display: grid;
      grid-template-columns: repeat(2, 160px);
      gap: 20px;
    }



   @keyframes changeBackground {
      75% {
        background-color: #5eefef;
    }
    50% {
        background-color: hsl(51, 100%, 80%);
    }
    100% {
        background-color: #61d8e3;
    }
    25% {
        background-color:rgb(150, 68, 209) ;
    }
     25% {
        background-color:rgb(190, 31, 187) ;
    }
     25% {
        background-color:rgb(52, 167, 126) ;
    }
     100% {
        background-color: #dbf2f4;
    }
     90% {
        background-color: #27cd4e;
    }
     100% {
        background-color: #5cd5e0;
    }
     36% {
        background-color: #e284f0;
    }

    }
             img{
          display: block;
          margin: auto;
        }
                .image-container {
    width: 35%;
    margin: 40px auto;
    text-align: center;
}

.image-container img {
    width: 100%;
    height: auto;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    transition: transform 0.5s;
}

.image-container img:hover {
    transform: scale(1.1);
}
a{
  text-align: center;
}
    .btn-blue { background: linear-gradient(to right, #00b4db, #0083b0); }
    .btn-darkblue { background: linear-gradient(to right, #000046, #1CB5E0); }
    .btn-pink { background: linear-gradient(to right, #ff416c, #ff4b2b); }
    .btn-purple { background: linear-gradient(to right, #8e2de2, #4a00e0); }
.footer{
float: left;
font-weight: bolder;
}
.glossy-button btn-blue,.glossy-button btn-darkblue,.glossy-button btn-pink,.glossy-button btn-purple
{
     position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
 
}

.glossy-button{
  position: relative;
  width: 200px;
  height: 50px;
}
.glossy-button :hover{
  background-color: #4a00e0;
}
</style>
<body>

</div></br></br></br>
