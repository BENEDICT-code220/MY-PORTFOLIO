body {
  margin: 0;
  background:linear-gradient(-45deg,rgb(2, 0, 48),rgb(2, 2, 30),rgb(1, 0, 28),rgb(1, 1, 9),rgb(1, 0, 33),rgb(9, 0, 52));
  overflow: hidden;
  height: 100vh;
}

.fireworks-container {
  position: relative;
  width: 100%;
  height: 100%;
}

.firework {
  position: absolute;
  bottom: 0;
  left: 50%;
  width: 4px;
  height: 4px;
  background-color: transparent;
  border-radius: 50%;
  animation: shoot 2s infinite ease-in-out;
}

.firework::before,
.firework::after {
  content: "";
  position: absolute;
  top: -4px;
  left: -4px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: radial-gradient(circle, #ff0, #f00, transparent 70%);
  opacity: 0;
  transform: scale(0);
  animation: explode 2s infinite ease-in-out;
}

.firework.delay1 {
  left: 30%;
  animation-delay: 0.6s;
}
.firework.delay1::before,
.firework.delay1::after {
  animation-delay: 0.6s;
}

.firework.delay2 {
  left: 70%;
  animation-delay: 1.2s;
}
.firework.delay2::before,
.firework.delay2::after {
  animation-delay: 1.2s;
}

@keyframes shoot {
  0% {
    transform: translateY(0);
    background-color: #fff;
  }
  50% {
    transform: translateY(-60vh);
    background-color: #fff;
  }
  100% {
    transform: translateY(0);
    background-color: transparent;
  }
}

@keyframes explode {
  0%, 49% {
    opacity: 0;
    transform: scale(0);
  }
  50% {
    opacity: 1;
    transform: scale(1);
  }
  100% {
    opacity: 0;
    transform: scale(1.5);
  }
}
.overlay-content {
  position: relative;
  z-index: 1;
  text-align: center;
  color: white;
  top: 30%;
  padding: 0 5vw;
  font-family: Arial, sans-serif;
}
